version: '3.9'

services:
  # MongoDB for conversation storage and metadata
  mongodb:
    image: mongo:7.0
    container_name: ai-chatbot-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_chatbot
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ai-chatbot-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ai-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - MONGODB_URI=mongodb://admin:admin_password@mongodb:27017/ai_chatbot?authSource=admin
      - FRONTEND_URL=http://localhost:3001
      # LLM Provider keys (configure from .env)
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/app:/app/app
      - ./backend/logs:/app/logs
      - chroma_data:/app/data/vectors
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ai-chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Next.js service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ai-chatbot-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3001
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      - backend
    networks:
      - ai-chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: ai-chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-chatbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    name: ai-chatbot-mongodb-data
  mongodb_config:
    name: ai-chatbot-mongodb-config
  chroma_data:
    name: ai-chatbot-chroma-data
  redis_data:
    name: ai-chatbot-redis-data

networks:
  ai-chatbot-network:
    driver: bridge


  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      MONGODB_URI: mongodb://mongo:27017/ai-chatbot
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      - backend
      - mongo
    ports:
      - "3000:3000"

volumes:
  mongo_data: